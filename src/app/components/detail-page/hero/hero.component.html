<header class="mountain-hero">
  <div class="mountain-hero__bg"></div>
  <div class="mountain-hero__content">
    <div class="mountain-hero__info">
      <p class="mountain-hero__region">
        <app-icon [icon]="'map-pin'" [size]="16" [stroke]="'primary-dark'"></app-icon>
        {{ mountainDetails.location }}
      </p>
      <h1 class="mountain-hero__name">{{ mountainDetails.name }}</h1>
      <p class="mountain-hero__details">
        {{ mountainDetails.description }} • {{ mountainDetails.altitude }}
      </p>
    </div>
    <div class="mountain-hero__badge">
      <span class="mountain-hero__badge-count">{{
        statisticsService.getStatsForMountain(mountainStateService.mountainName()).totalClimbs
      }}</span>
      <span class="mountain-hero__badge-label">výstupů</span>
    </div>
  </div>
</header>
