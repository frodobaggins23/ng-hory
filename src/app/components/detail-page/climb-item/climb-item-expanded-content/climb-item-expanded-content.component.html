<div class="divider"></div>

<div class="description-section">
  <h3 class="detail-title">{{ 'climb.description' | translate }}</h3>
  <p class="full-description">{{ climb.description }}</p>
</div>

@if (climb.imgs && climb.imgs.length > 0) {
  <app-climb-gallery
    [images]="climb.imgs"
    [mountainName]="mountainName"
    [imgFolder]="imgFolder"
  ></app-climb-gallery>
}

@if (trackData) {
  <div class="map-placeholder">
    <h3 class="detail-title">{{ 'climb.gpsTrack' | translate }}</h3>
    <app-track-map [track]="trackData" [climbId]="climb.id"></app-track-map>
  </div>
}
