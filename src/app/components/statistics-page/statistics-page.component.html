<div class="statistics-page">
  <app-nav />
  <app-hero [selectedYear]="year" />
  <div class="statistics-page-content">
    @if (year === '2026') {
      <app-statistics-not-enough-data />
    } @else {
      <app-statistics-stats-card-container />
      <app-statistics-monhtly-bar-chart />
      <app-statistics-cumulative-elevation-chart />
      <app-statistics-ranking-container />
    }
  </div>
</div>
