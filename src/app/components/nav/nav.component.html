<nav class="nav-container">
  <div class="nav-content">
    <div class="nav-logo" (click)="navigate('home')">
      <div class="logo-icon">
        <app-icon icon="mountain" stroke="primary-light" [size]="25" />
      </div>
      <span class="logo-text">Moje Hory</span>
    </div>

    <div class="nav-tabs">
      @for (item of navItems; track item) {
        <button
          (click)="navigate(item.id)"
          [class.active]="activePage() === item.id"
          class="nav-tab"
          [attr.aria-current]="activePage() === item.id ? 'page' : null"
        >
          <app-icon [icon]="item.icon" stroke="primary-dark" [size]="16" />
          <span class="nav-tab-label">{{ item.labelKey | translate }}</span>
        </button>
      }
    </div>

    <div class="lang-switcher">
      <button
        class="lang-btn"
        [class.active]="currentLang() === 'cs'"
        (click)="setLanguage('cs')"
        aria-label="Czech"
      >
        CS
      </button>
      <span class="lang-divider">|</span>
      <button
        class="lang-btn"
        [class.active]="currentLang() === 'en'"
        (click)="setLanguage('en')"
        aria-label="English"
      >
        EN
      </button>
    </div>
  </div>
</nav>
