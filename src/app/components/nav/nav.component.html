<nav class="nav-container">
  <div class="nav-content">
    <div class="nav-logo" (click)="navigate('home')">
      <div class="logo-icon">
        <app-icon icon="mountain" stroke="primary-light" [size]="25" />
      </div>
      <span class="logo-text">Moje Hory</span>
    </div>

    <div class="nav-tabs">
      @for (item of navItems; track item) {
        <button
          (click)="navigate(item.id)"
          [class.active]="activePage() === item.id"
          class="nav-tab"
          [attr.aria-current]="activePage() === item.id ? 'page' : null"
        >
          <app-icon [icon]="item.icon" stroke="primary-dark" [size]="16" />
          <span class="nav-tab-label">{{ item.label }}</span>
        </button>
      }
    </div>
  </div>
</nav>
