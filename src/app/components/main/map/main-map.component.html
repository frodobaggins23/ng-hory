<div id="map" class="leaflet-map"></div>
@if (showDialog) {
  <app-main-mountain-dialog
    [title]="dialogParams.selectedMountain"
    [subtitle]="dialogParams.subtitle"
    [statistics]="dialogStatistics"
    (closeOutput)="handleDialogClose()"
    (actionClickOutput)="handleDialogAction()"
  ></app-main-mountain-dialog>
}
