<div class="legend-item">
  <app-icon icon="mountain" stroke="primary-dark" [size]="16" />
  <span class="legend-text"
    ><span class="legend-text-emphasis">{{ mountainCount }}</span>
    {{ 'map.mountains' | translate }}</span
  >
</div>
<div class="legend-item">
  <app-icon icon="trending-up" stroke="primary-dark" [size]="16" />
  <span class="legend-text"
    ><span class="legend-text-emphasis">{{ climbCount }}</span> {{ 'map.climbs' | translate }}</span
  >
</div>
