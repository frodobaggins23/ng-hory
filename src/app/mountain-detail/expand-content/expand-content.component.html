<tr [ngClass]="{ visible: expanded, container: true }">
  <td class="expandContent">
    <div class="dashboard-layout">
      <div class="top-section">
        <div class="left-section">
          <div class="gallery-section" *ngIf="hasImages">
            <app-photo-gallery [images]="images" [mountainName]="mountainName"></app-photo-gallery>
          </div>
          <app-climb-description 
            *ngIf="!hasImages" 
            [description]="content.description">
          </app-climb-description>
        </div>
        <div class="metrics-section">
          <div class="metrics-grid">
            <div class="metric-item">
              <app-speedmeter 
                [value]="content.distance"
                label="Distance"
                type="distance"
                [animate]="expanded">
              </app-speedmeter>
            </div>
            <div class="metric-item">
              <app-speedmeter 
                [value]="content.elevationGain + 'm'"
                label="Elevation"
                type="elevation"
                [animate]="expanded">
              </app-speedmeter>
            </div>
            <div class="metric-item">
              <app-speedmeter 
                [value]="content.heartRate"
                label="Heart Rate"
                type="heart-rate"
                [animate]="expanded">
              </app-speedmeter>
            </div>
            <div class="metric-item">
              <app-speedmeter 
                [value]="content.duration"
                label="Duration"
                type="duration"
                [animate]="expanded">
              </app-speedmeter>
            </div>
          </div>
          <button *ngIf="hasTrack" class="track-button" (click)="showTrack(content.track!)">
            <span class="track-icon">👁️</span>
            <span class="track-text">Show Route</span>
          </button>
        </div>
      </div>
      
      <div class="bottom-description" *ngIf="hasImages">
        <app-climb-description [description]="content.description"></app-climb-description>
      </div>
    </div>
  </td>
</tr>
