<span
  class="icon"
  [class.rounded]="rounded"
  [class.paded]="hasVisibleBackground()"
  [style.--icon-fill]="getColor(fill)"
  [style.--icon-stroke]="getColor(stroke)"
  [style.background-color]="getColor(background)"
  [style.width.px]="size"
  [style.height.px]="size"
  [innerHTML]="sanitizedSvg"
>
</span>
