<app-nav></app-nav>
<div class="detail-page">
  <app-detail-page-hero></app-detail-page-hero>

  <section class="stats-section">
    <div class="stats-container">
      <app-stats-card
        icon="arrow-up"
        label="Celkové převýšení"
        value="{{ this.currentMountainStats.totalElevationGain | elevation }}"
        color="orange"
      ></app-stats-card>

      <app-stats-card
        icon="footprints"
        label="Celková vzdálenost"
        value="{{ this.currentMountainStats.totalDistance | distance }}"
        color="amber"
      ></app-stats-card>

      <app-stats-card
        icon="clock"
        label="Celkový čas"
        value="{{ this.currentMountainStats.totalDuration | duration }}"
        color="stone"
      ></app-stats-card>

      <app-stats-card
        icon="heart"
        label="Průměrný tep"
        value="{{ this.currentMountainStats.avgHeartRate | heartRate }}"
        color="rose"
      ></app-stats-card>
    </div>
  </section>
</div>
