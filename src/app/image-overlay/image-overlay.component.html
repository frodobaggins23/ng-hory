<div 
  class="image-overlay" 
  [class.show]="isVisible"
>
  <img 
    [src]="imageUrl" 
    [alt]="altText" 
    class="overlay-image"
  />

  <!-- Close Button -->
  <button 
    class="overlay-close-button" 
    (click)="closeOverlay.emit()"
    aria-label="Close image preview"
  >
    ✕
  </button>
</div>
