<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mountain Stats</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #fafaf9;
    }

    .stats-section {
      max-width: 80rem;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    @media (min-width: 640px) {
      .stats-section {
        padding: 2rem 1.5rem;
      }
    }

    .stats-grid {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin: 0 -1rem;
      padding-left: 1rem;
      padding-right: 1rem;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .stats-grid::-webkit-scrollbar {
      display: none;
    }

    @media (min-width: 640px) {
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        overflow: visible;
        margin: 0;
        padding: 0;
      }
    }

    .stat-card {
      flex-shrink: 0;
      width: 9rem;
      background-color: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    @media (min-width: 640px) {
      .stat-card {
        width: auto;
        padding: 1.25rem;
      }
    }

    .stat-card__icon {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    @media (min-width: 640px) {
      .stat-card__icon {
        width: 2.5rem;
        height: 2.5rem;
        margin-bottom: 0.75rem;
      }
    }

    .stat-card__icon svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    .stat-card__value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #292524;
    }

    @media (min-width: 640px) {
      .stat-card__value {
        font-size: 1.5rem;
      }
    }

    .stat-card__label {
      font-size: 0.75rem;
      color: #78716b;
    }

    @media (min-width: 640px) {
      .stat-card__label {
        font-size: 0.875rem;
      }
    }

    /* Orange variant */
    .stat-card--orange .stat-card__icon {
      background-color: #ffedd5;
      color: #f97316;
    }

    /* Amber variant */
    .stat-card--amber .stat-card__icon {
      background-color: rgba(234, 179, 8, 0.15);
      color: #ca8a04;
    }

    /* Stone variant */
    .stat-card--stone .stat-card__icon {
      background-color: #f5f5f4;
      color: #57534e;
    }

    /* Rose variant */
    .stat-card--rose .stat-card__icon {
      background-color: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
    }
  </style>
</head>
<body>
  <section class="stats-section">
    <div class="stats-grid">
      <!-- Převýšení -->
      <div class="stat-card stat-card--orange">
        <div class="stat-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 12 7-7 7 7"/>
            <path d="M12 19V5"/>
          </svg>
        </div>
        <div class="stat-card__value">2,256 m</div>
        <div class="stat-card__label">Převýšení</div>
      </div>

      <!-- Vzdálenost -->
      <div class="stat-card stat-card--amber">
        <div class="stat-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
            <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            <path d="M16 17h4"/>
            <path d="M4 13h4"/>
          </svg>
        </div>
        <div class="stat-card__value">29.2 km</div>
        <div class="stat-card__label">Vzdálenost</div>
      </div>

      <!-- Čas -->
      <div class="stat-card stat-card--stone">
        <div class="stat-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="stat-card__value">8:03:36</div>
        <div class="stat-card__label">Čas</div>
      </div>

      <!-- Prům. tep -->
      <div class="stat-card stat-card--rose">
        <div class="stat-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
        </div>
        <div class="stat-card__value">134 bpm</div>
        <div class="stat-card__label">Prům. tep</div>
      </div>
    </div>
  </section>
</body>
</html>
