on:
  pull_request:
    types: [opened, synchronize, reopened]

name: 🔍 PR Checks

jobs:
  checks:
    name: Build, TypeScript & Lint
    runs-on: ubuntu-latest
    env:
      API_KEY: placeholder
      FILE_SERVER_HOST: https://kubac.website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        id: tsc
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Post results comment
        uses: actions/github-script@v7
        with:
          script: |
            const tsc   = '${{ steps.tsc.outcome }}';
            const lint  = '${{ steps.lint.outcome }}';
            const build = '${{ steps.build.outcome }}';

            const icon = (outcome) => outcome === 'success' ? '✅' : '❌';

            const body = [
              '## Automated PR Checks',
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| TypeScript (\`tsc --noEmit\`) | ${icon(tsc)} ${tsc} |`,
              `| ESLint | ${icon(lint)} ${lint} |`,
              `| Build (\`ng build\`) | ${icon(build)} ${build} |`,
              '',
              [tsc, lint, build].every(r => r === 'success')
                ? '> All checks passed.'
                : '> One or more checks failed — see job logs for details.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
